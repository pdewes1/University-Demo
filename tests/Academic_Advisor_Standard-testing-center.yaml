# Agentforce Testing Center suite for the standard-actions Advisor Agent (Query Records and Update Record; sharing does the owner check). Generated by tests/build_suite.py; edit there.
# Run as an advisor who owns Priya Cooper and Aisha Allen but not Steven Anderson or John Carter.
# Actions run LIVE: email, booking-link, task, note and update cases write to the org.
#   sf agent test create --spec tests/Academic_Advisor_Standard-testing-center.yaml --api-name Advisor_Standard_Validation -o <org>
#   sf agent test run --api-name Advisor_Standard_Validation --wait 15 --result-format json -o <org>
# Cases without expectedTopic are guardrails: ignore topic_assertion on those and read output_validation.
# Expected actions use the definition names Testing Center reports (QueryStudentRecords, Get_Student_360_Data, ...).
# Refusals that name a student expect only QueryStudentRecords, which returns nothing for other advisors' students.
# Students not owned by the running advisor: Steven Anderson (U00001), John Carter (U00007).

name: "Advisor Agent Standard Validation"
subjectType: AGENT
subjectName: Academic_Advisor_Standard

testCases:
  # G01 (grounding)
  - utterance: "What should I know about this student?"
    contextVariables:
      - name: currentRecordId
        value: "003bm000025lOHWAA2"
      - name: currentObjectApiName
        value: "Contact"
    expectedTopic: student_advising
    expectedActions:
      - QueryStudentRecords
      - Get_Student_360_Data
      - Brief_Student
    expectedOutcome: "Summarizes Priya Cooper's attendance, coursework, LMS activity, engagement score and financial aid status, and names the two or three things to act on. States no financial aid dollar amounts. Uses the four-part briefing: where they stand, what to act on, last contact and follow-ups, suggested next step."

